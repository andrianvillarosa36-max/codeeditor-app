name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Bundle git libraries locally (avoids runtime CDN dependency)
        run: |
          mkdir -p public/vendor
          curl -fsSL https://cdn.jsdelivr.net/npm/isomorphic-git -o public/vendor/isomorphic-git.js
          curl -fsSL https://cdn.jsdelivr.net/npm/isomorphic-git/http/web/index.umd.js -o public/vendor/isomorphic-git-http-web.js
          echo "---- downloaded files ----"
          ls -la public/vendor/
          echo "---- first line of each (sanity check it's real JS, not an error page) ----"
          head -c 200 public/vendor/isomorphic-git.js; echo
          head -c 200 public/vendor/isomorphic-git-http-web.js; echo

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply native storage plugin
        run: |
          mkdir -p android/app/src/main/java/com/termux/codeeditor
          cp native-src/main/java/com/termux/codeeditor/*.java android/app/src/main/java/com/termux/codeeditor/
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml
          echo "---- MainActivity ----"; cat android/app/src/main/java/com/termux/codeeditor/MainActivity.java
          echo "---- Manifest ----"; cat android/app/src/main/AndroidManifest.xml

      - name: Add NanoHTTPD dependency (for the local server plugin)
        run: |
          sed -i "/dependencies {/a\\    implementation 'org.nanohttpd:nanohttpd:2.3.1'" android/app/build.gradle
          echo "---- app/build.gradle dependencies ----"
          grep -n -A 15 "dependencies {" android/app/build.gradle | head -20

      - name: Apply custom app icon
        run: |
          cp -rf icons/mipmap-* android/app/src/main/res/
          mkdir -p android/app/src/main/res/values
          cp -f icons/values/ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_background.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coodev-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
