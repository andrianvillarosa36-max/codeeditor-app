name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply native storage plugin
        run: |
          mkdir -p android/app/src/main/java/com/termux/codeeditor
          cp native-src/main/java/com/termux/codeeditor/*.java android/app/src/main/java/com/termux/codeeditor/
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml
          echo "---- MainActivity ----"; cat android/app/src/main/java/com/termux/codeeditor/MainActivity.java
          echo "---- Manifest ----"; cat android/app/src/main/AndroidManifest.xml

      - name: Apply custom app icon
        run: cp -rf icons/mipmap-* android/app/src/main/res/

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: code-editor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
