<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Termux Code Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="topbar">
    <button id="toggle-sidebar" title="Toggle explorer">☰</button>
    <span id="root-path">loading…</span>
    <div id="topbar-actions">
      <button id="btn-preview">Preview</button>
      <button id="new-file-btn">+ File</button>
      <button id="new-project-btn">New Project</button>
      <button id="save-btn">Save</button>
    </div>
  </div>
  <div id="main">
    <div id="sidebar">
      <input id="tree-filter" type="text" placeholder="Filter files…" />
      <div id="file-tree"></div>
    </div>
    <div id="editor-area">
      <div id="tabs"></div>
      <div id="breadcrumb"></div>
      <div id="editor-container"></div>
      <div id="empty-state">Open a file from the explorer to start editing.</div>
      <div id="preview-panel" class="hidden">
        <div id="preview-topbar">
          <span>Preview</span>
          <button id="close-preview">✕ Close</button>
        </div>
        <iframe id="preview-frame" sandbox="allow-scripts"></iframe>
      </div>
      <div id="permission-gate" class="hidden">
        <div class="gate-box">
          <h2>Storage access needed</h2>
          <p>This editor reads and writes real files on your device, so it
             needs the "All files access" permission — the same one file
             manager apps use.</p>
          <button id="grant-btn">Grant Access</button>
          <p id="gate-hint" class="gate-hint">This opens Android Settings. Flip the toggle on, then come back here.</p>
          <button id="continue-btn" class="secondary">Continue</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs/loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
